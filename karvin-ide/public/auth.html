<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Sign in · KARVIN</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head>
<body><main class="auth-shell"><a class="brand" href="/" aria-label="Karvin home"><span class="mark">◈</span><span>KARVIN<small>AI WORKSPACE</small></span></a>
<section class="auth-card"><p class="eyebrow">YOUR PRIVATE WORKSPACE</p><h1 id="heading">Welcome back</h1><p class="subheading" id="subheading">Sign in to open your projects and tools.</p>
<div class="auth-tabs" role="tablist"><button type="button" id="signin-tab" aria-selected="true">Sign in</button><button type="button" id="signup-tab" aria-selected="false">Create account</button></div>
<form id="auth-form"><label id="name-label" for="name" hidden>Your name</label><input id="name" name="name" autocomplete="name" maxlength="80" placeholder="Your name" hidden>
<label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" required placeholder="you@example.com">
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required placeholder="At least 12 characters">
<label id="confirm-label" for="confirm-password" hidden>Confirm password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Repeat your password" hidden>
<button class="submit" id="submit" type="submit">Sign in <span>→</span></button><p id="message" role="status" aria-live="polite"></p></form>
<p class="privacy-note">Your workspace files and AI connections are private to your account. Payments are not enabled.</p></section>
<footer><a href="/">Back to Karvin home</a><span>Private by account</span></footer></main></body></html>
